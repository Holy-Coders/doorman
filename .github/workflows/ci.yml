name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm protocol:sync && git diff --exit-code -- protocol packages/elixir/priv
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --filter @aarondovturkel/doorman-example-nextjs build
      - run: pnpm --filter @aarondovturkel/doorman-example-cloudflare build
      - run: pnpm --filter @aarondovturkel/doorman-example-learning-worker build
      - run: pnpm site:check
      - run: pnpm site:test
      - run: pnpm --filter @aarondovturkel/doorman-site exec wrangler deploy --dry-run

  elixir:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: visitor
          POSTGRES_PASSWORD: visitor
          POSTGRES_DB: visitors
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U visitor -d visitors"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://visitor:visitor@localhost:55433/visitors
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2"
      - run: mix deps.get && mix format --check-formatted && mix test --warnings-as-errors
        working-directory: packages/elixir
      - run: mix deps.get && mix format --check-formatted && mix ecto.migrate && mix test --warnings-as-errors
        working-directory: examples/phoenix

  clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - run: python -m pip install ./packages/python
      - run: python -m unittest discover -s packages/python/tests -v
      - run: go test -race ./...
        working-directory: packages/go
      - run: go build -o /tmp/doorman-example .
        working-directory: examples/go-http

  classifier:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: doorman
          POSTGRES_PASSWORD: doorman-ci-only
          POSTGRES_DB: doorman_network
        ports: ["55436:5432"]
        options: >-
          --health-cmd "pg_isready -U doorman -d doorman_network"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/classifier/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r tools/classifier/requirements.txt
      - run: python -m unittest discover -s tools/benchmarks -p 'test_*.py' -v
      - run: pnpm build
      - run: pnpm exec vitest run tests/classifier-training.test.ts tests/classifier-service.test.ts tests/network-service.test.ts
        env:
          CLASSIFIER_PYTHON: ${{ steps.python.outputs.python-path }}
          NETWORK_TEST_DATABASE_URL: postgres://doorman:doorman-ci-only@localhost:55436/doorman_network
