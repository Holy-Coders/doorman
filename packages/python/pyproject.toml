[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doorman-identity-client"
version = "0.9.0"
description = "Bounded, stateless HTTP client for your own Doorman identity endpoint"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.packages.find]
include = ["doorman_client*"]
