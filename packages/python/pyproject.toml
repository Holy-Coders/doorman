[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "janitor-identity-client"
version = "0.9.0"
description = "Bounded, stateless HTTP client for your own Janitor identity endpoint"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools.packages.find]
include = ["janitor_client*"]
